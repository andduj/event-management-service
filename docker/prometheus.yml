global:
  scrape_interval: 15s

scrape_configs:
  - job_name: events-api
    static_configs:
      - targets: ["events-api:8080"]
    metrics_path: /metrics

  - job_name: bookings-api
    static_configs:
      - targets: ["bookings-api:8080"]
    metrics_path: /metrics

  - job_name: auth-api
    static_configs:
      - targets: ["auth-api:8080"]
    metrics_path: /metrics
